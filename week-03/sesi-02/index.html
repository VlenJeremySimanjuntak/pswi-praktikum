<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pendaftaran Kegiatan</title>
</head>

<body>
    <main>
        <h1>Pendaftaran Kegiatan</h1>
        <p>Kolom bertanda wajib harus diisi.</p>

        <form action="" method="get">
            <!-- 1. Input Teks Nama Lengkap -->
            <p>
                <label for="nama">Nama lengkap (wajib)</label><br>
                <input id="nama" name="nama" type="text" autocomplete="name" required>
            </p>

            <!-- 2. Input Email -->
            <p>
                <label for="email">Email (wajib)</label><br>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </p>

            <!-- 3. Latihan Mandiri: Input Telepon -->
            <p>
                <label for="telepon">Nomor telepon</label><br>
                <input id="telepon" name="telepon" type="tel" autocomplete="tel">
            </p>

            <!-- 4. Pilihan Dropdown Program Studi -->
            <p>
                <label for="prodi">Program studi (wajib)</label><br>
                <select id="prodi" name="prodi" required>
                    <option value="">Pilih program studi</option>
                    <option value="trpl">D4 TRPL</option>
                    <option value="ti">D3 Teknologi Informasi</option>
                </select>
            </p>

            <!-- 5. Latihan Mandiri: Input Jumlah Tiket -->
            <p>
                <label for="tiket">Jumlah tiket (1-5, wajib)</label><br>
                <input id="tiket" name="tiket" type="number" min="1" max="5" step="1" required>
            </p>

            <!-- 6. Pilihan Radio: Mode Kehadiran -->
            <fieldset>
                <legend>Mode kehadiran (wajib)</legend>
                <input id="luring" name="mode" type="radio" value="luring" required>
                <label for="luring">Luring</label>

                <input id="daring" name="mode" type="radio" value="daring">
                <label for="daring">Daring</label>
            </fieldset>

            <!-- 7. Latihan Mandiri: Checkbox Minat Topik -->
            <fieldset>
                <legend>Minat topik (opsional)</legend>
                <input id="topik-html" name="minat" type="checkbox" value="html">
                <label for="topik-html">HTML Semantik</label>

                <input id="topik-aksesibilitas" name="minat" type="checkbox" value="aksesibilitas">
                <label for="topik-aksesibilitas">Aksesibilitas Web</label>
            </fieldset>

            <!-- 8. Area Teks Catatan -->
            <p>
                <label for="catatan">Catatan (opsional)</label><br>
                <textarea id="catatan" name="catatan" rows="4" maxlength="300"></textarea>
            </p>

            <!-- 9. Tombol Submit -->
            <p>
                <button type="submit">Daftar</button>
            </p>
        </form>
    </main>
</body>

</html>
